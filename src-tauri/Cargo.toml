[package]
name = "search"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
anyhow = "1.0"

candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.7.2" }
candle-nn = "0.7.2"
candle-transformers = "0.7.2"

clap = { version = "4.0", features = ["derive"] }
cpal = { version = "0.15.2", optional = true }
csv = "1.3.0"
cudarc = { version = "0.12.1", features = ["std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "cuda-version-from-build-system", "dynamic-linking"], optional = true }
enterpolation = { version = "0.2.1", optional = true }
half = { version = "2.3.1", features = ["num-traits", "use-intrinsics", "rand_distr"], optional = true }
hf-hub = { version = "0.3.3", features = ["tokio"], package = "candle-hf-hub" }
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
num-traits = "0.2.15"
palette = { version = "0.7.6", optional = true }
pdf2image = { version = "0.1.2", optional = true }
pyo3 = { version = "0.22.0", features = ["auto-initialize"], optional = true }
rayon = "1.7.0"
rubato = { version = "0.15.0", optional = true }
rusqlite = { version = "0.32.0", features = ["bundled"] }
safetensors = "0.4.1"
scan_dir = "0.3.3"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"
symphonia = { version = "0.5.3", features = ["all"], optional = true }
tauri = { version = "1", features = ["dialog-save", "dialog-open", "shell-open"] }
tokenizers = { version = "0.19.1", default-features = false, features = ["onig"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
